# Runs the full solution (NestJS BFF + Angular app).
# Expects the backend repository cloned next to this one; override with BACKEND_CONTEXT.
name: pokemon-explorer

services:
  backend:
    build: ${BACKEND_CONTEXT:-../sii-test-backend}
    image: pokemon-explorer-backend
    environment:
      PORT: 3000
      POKEAPI_BASE_URL: https://pokeapi.co/api/v2
      CACHE_TTL_SECONDS: 3600
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    build: .
    image: pokemon-explorer-frontend
    environment:
      BFF_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
